name: JS-test-two

on:
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build-and-deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Build Angular Project and Run PSE

    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: ${{secrets.IR_TOKEN}}
      # ============= InvisiRisk Setup End =============
